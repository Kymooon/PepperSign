; PepperSign Controll - processi del container
; Xvfb (display virtuale) -> fluxbox (window manager) -> x11vnc (server VNC)
; -> websockify/noVNC (VNC nel browser, porta 6080) + controller PepperSign.

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=/usr/local/bin/start-vnc.sh
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:novnc]
; websockify 0.10 (scaricato in /opt/websockify, vedi Dockerfile)
command=/usr/bin/python3 -m websockify --web /opt/novnc 6080 127.0.0.1:5900
directory=/opt/websockify
priority=40
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; Il controller attende il robot (PEPPERSIGN_ROBOT_WAIT) e viene riavviato
; automaticamente se la finestra viene chiusa o il programma termina.
; I suoi log finiscono in "docker compose logs controll".
[program:peppersign]
command=/usr/local/bin/run-controller.sh
directory=/opt/peppersign
priority=50
autorestart=true
startsecs=0
startretries=1000
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
